<svg xmlns="http://www.w3.org/2000/svg" width="280" height="80">
  <style>
    @keyframes popUp {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(-10px);
      }
      50% {
        transform: scale(1.05) translateY(0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .bubble {
      animation: popUp 0.6s ease-out forwards;
      opacity: 0;
      transform-origin: center;
    }
    .text {
      animation: popUp 0.6s ease-out 0.2s forwards;
      opacity: 0;
      transform-origin: center;
    }
  </style>
  
  <g class="bubble">
    <!-- Speech bubble body -->
    <rect x="10" y="10" width="260" height="50" rx="16" ry="16" 
          fill="#21262d" 
          stroke="#30363d" 
          stroke-width="1.5"/>
    
    <!-- Speech bubble tail -->
    <path d="M 25 60 L 10 75 L 25 70 Z" 
          fill="#21262d" 
          stroke="#30363d" 
          stroke-width="1.5"/>
  </g>
  
  <!-- Text -->
  <text class="text" x="140" y="42" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" 
        font-size="15" 
        font-weight="500"
        fill="#ffffff" 
        text-anchor="middle">Hi, I'm Sophia</text>
</svg>